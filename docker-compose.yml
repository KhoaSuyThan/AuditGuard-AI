version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auditguard-postgres
    restart: always
    environment:
      POSTGRES_USER: audituser
      POSTGRES_PASSWORD: auditpass
      POSTGRES_DB: auditguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audituser -d auditguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
